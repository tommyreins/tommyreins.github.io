# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:latest
    build: .
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
    # Use the repo entrypoint (volume-mounted) so bundle install runs on start
    command: ["/bin/bash", "/srv/jekyll/bin/entry_point.sh"]
